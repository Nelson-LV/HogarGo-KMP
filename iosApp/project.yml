name: iosApp
options:
  bundleIdPrefix: com.hogargo
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hogargo.kmp.iosApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: iosApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: HogarGo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Kotlin solo genera simulador arm64 (Mac con Apple Silicon)
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # El framework Kotlin se genera en composeApp/build/xcode-frameworks
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # -lsqlite3: el framework estatico usa el driver nativo de SQLDelight
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp -lsqlite3"
        # Quita los envoltorios de sqlite3_load_extension, que el SDK de iOS ya no exporta
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compilar framework Kotlin
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
